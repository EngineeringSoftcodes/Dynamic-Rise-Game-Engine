<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dynamic Rise™ — Editor (with Viewfield)</title>
<style>
  :root{
    --bg:#07101a; --panel:#0b1622; --muted:#8aa0b6; --accent:#6cf; --line:#163043;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:#e9f2fb;font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
  .app{height:100%;display:grid;grid-template-columns:300px 1fr 360px;grid-template-rows:56px 1fr 150px;gap:0}
  header{grid-column:1/-1;display:flex;align-items:center;padding:8px 12px;background:linear-gradient(180deg,#061025,#081726);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;letter-spacing:.08em;margin-right:10px}
  .btn{background:#0f2435;border:1px solid #213a52;padding:8px 10px;border-radius:8px;color:inherit;cursor:pointer;margin-right:8px}
  .chip{background:#0e2434;border:1px solid #19374f;padding:6px 10px;border-radius:999px;cursor:pointer}
  .spacer{flex:1}
  aside{overflow:auto}
  .left{background:var(--panel);border-right:1px solid var(--line)}
  .right{background:var(--panel);border-left:1px solid var(--line)}
  .section{padding:10px;border-bottom:1px solid var(--line)}
  .section h3{margin:0 0 8px 0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .hierarchy-item{padding:8px;border-radius:6px;cursor:pointer;margin-bottom:6px;background:transparent}
  .hierarchy-item:hover{background:#071826}
  .hierarchy-item.active{outline:1px solid #2a4f78;background:#0b2234}
  main{position:relative;background:radial-gradient(800px 300px at 60% 20%, #0d1b2a 0%, #07101a 50%)}
  canvas#viewport{position:absolute;inset:0;display:block;outline:none}
  .toolbar{position:absolute;left:12px;top:12px;background:rgba(6,16,24,0.6);backdrop-filter:blur(6px);padding:8px;border-radius:10px;border:1px solid #18314a}
  .statusbar{grid-column:1/-1;background:var(--panel);display:grid;grid-template-columns:300px 1fr 360px;border-top:1px solid var(--line)}
  .console{padding:8px;font-family:ui-monospace,Consolas,Menlo,monospace;white-space:pre-wrap;overflow:auto;height:150px}
  .inspector label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
  .inspector input,.inspector select{width:100%;padding:8px;border-radius:8px;background:#071721;border:1px solid #1b425b;color:inherit}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tiny{font-size:12px;color:var(--muted)}
  input[type=file]{display:none}
  /* viewfield (mini-map) */
  .viewfield {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 220px;
    height: 140px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(30,60,90,0.6);
    background: linear-gradient(180deg, rgba(8,18,28,0.8), rgba(6,12,20,0.6));
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  }
  .viewfield .label { padding:6px 8px; font-size:12px; color:var(--muted); border-bottom:1px solid rgba(30,60,90,0.2); background:transparent }
  .viewfield canvas { display:block; width:100%; height:calc(100% - 28px); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Dynamic Rise™ Engine</div>
    <button id="btnAddCube" class="btn">+ Cube</button>
    <button id="btnAddPlane" class="btn">+ Plane</button>
    <button id="btnAddLight" class="btn">+ Light</button>
    <div class="spacer"></div>
    <div class="row">
      <button id="btnGizmoT" class="chip">Move (1)</button>
      <button id="btnGizmoR" class="chip">Rotate (2)</button>
      <button id="btnGizmoS" class="chip">Scale (3)</button>
      <button id="btnSnap" class="chip">Snap</button>
      <button id="btnCam" class="chip">Cam: Editor</button>
      <button id="btnSave" class="chip">Save</button>
      <label for="fileLoad" class="chip" style="cursor:pointer">Load</label>
      <input id="fileLoad" type="file" accept="application/json" />
      <label for="fileGLTF" class="chip" style="cursor:pointer">Import glTF</label>
      <input id="fileGLTF" type="file" accept=".gltf,.glb,model/gltf-binary,model/gltf+json" />
    </div>
  </header>

  <aside class="left">
    <div class="section">
      <h3>Hierarchy</h3>
      <div id="hierarchy" style="padding-right:10px"></div>
    </div>
    <div class="section">
      <h3>Environment</h3>
      <div class="row" style="margin-bottom:8px">
        <button id="btnGrid" class="btn">Grid</button>
        <button id="btnAxes" class="btn">Axes</button>
        <button id="btnSky" class="btn">Sky</button>
      </div>
      <div class="tiny">Tone</div>
      <select id="toneMapping" style="width:100%;margin-top:6px;margin-bottom:8px">
        <option value="1" selected>ACES</option><option value="0">None</option><option value="2">Reinhard</option><option value="3">Cineon</option><option value="4">Linear</option>
      </select>
      <div class="tiny">Exposure</div>
      <input id="exposure" type="range" min="0.2" max="2.0" step="0.01" value="1.0" style="width:100%;margin-top:6px">
    </div>
  </aside>

  <main>
    <canvas id="viewport" tabindex="0"></canvas>

    <!-- viewfield mini-map -->
    <div class="viewfield" id="viewfield">
      <div class="label">Viewfield (Top / Camera preview)</div>
      <canvas id="miniView"></canvas>
    </div>

    <div class="toolbar tiny">WASD: game cam • RMB-look • F: focus • 1/2/3: gizmo • Drag & drop .glb</div>
  </main>

  <aside class="right">
    <div class="section">
      <h3>Inspector</h3>
      <div class="inspector" id="inspector">
        <label>Pos X <input id="posX" type="number" step="0.01" /></label>
        <label>Pos Y <input id="posY" type="number" step="0.01" /></label>
        <label>Pos Z <input id="posZ" type="number" step="0.01" /></label>
        <label>Rot X <input id="rotX" type="number" step="0.1" /></label>
        <label>Rot Y <input id="rotY" type="number" step="0.1" /></label>
        <label>Rot Z <input id="rotZ" type="number" step="0.1" /></label>
        <label>Scale <input id="scaleU" type="number" step="0.01" value="1" /></label>
        <label>Color <input id="matColor" type="color" value="#6aa4ff" /></label>
        <label>Roughness <input id="rough" type="range" min="0" max="1" step="0.01" value="0.6" /></label>
        <label>Metalness <input id="metal" type="range" min="0" max="1" step="0.01" value="0.1" /></label>
      </div>
    </div>
  </aside>

  <div class="statusbar">
    <div class="section" style="border-right:1px solid var(--line)">
      <h3>Selection</h3>
      <div id="selectionInfo" class="tiny">None</div>
    </div>
    <div class="console" id="console"></div>
    <div class="section" style="border-left:1px solid var(--line)">
      <h3>Renderer</h3>
      <div class="tiny">Three.js • PBR • FXAA • EnvMap • Soft Shadows</div>
    </div>
  </div>
</div>

<script type="module">
/* -------------------------
   Dynamic Rise — Editor vX
   - main viewport (three.js)
   - mini viewfield (orthographic top-down + camera preview)
   - drag & drop import, gizmo, inspector, save/load
   ------------------------- */
import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';
import { TransformControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/TransformControls.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'https://unpkg.com/three@0.161.0/examples/jsm/environments/RoomEnvironment.js';
import { EffectComposer } from 'https://unpkg.com/three@0.161.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.161.0/examples/jsm/postprocessing/RenderPass.js';
import { ShaderPass } from 'https://unpkg.com/three@0.161.0/examples/jsm/postprocessing/ShaderPass.js';
import { FXAAShader } from 'https://unpkg.com/three@0.161.0/examples/jsm/shaders/FXAAShader.js';

const canvas = document.getElementById('viewport');
const miniCanvas = document.getElementById('miniView');
const hierarchyEl = document.getElementById('hierarchy');
const consoleEl = document.getElementById('console');
const selectionInfo = document.getElementById('selectionInfo');
const inspector = {
  posX: document.getElementById('posX'),
  posY: document.getElementById('posY'),
  posZ: document.getElementById('posZ'),
  rotX: document.getElementById('rotX'),
  rotY: document.getElementById('rotY'),
  rotZ: document.getElementById('rotZ'),
  scaleU: document.getElementById('scaleU'),
  matColor: document.getElementById('matColor'),
  rough: document.getElementById('rough'),
  metal: document.getElementById('metal')
};
const fileGLTF = document.getElementById('fileGLTF');
const fileLoad = document.getElementById('fileLoad');

// logger
function log(...a){ consoleEl.textContent += a.join(' ') + '\n'; consoleEl.scrollTop = consoleEl.scrollHeight; }
log('Booting Dynamic Rise viewfield editor...');

// sizes
function getViewportSize(){ const r = canvas.parentElement.getBoundingClientRect(); return { w: Math.max(16, Math.floor(r.width)), h: Math.max(16, Math.floor(r.height)) }; }
function getMiniSize(){ const r = miniCanvas.getBoundingClientRect(); return { w: Math.max(8, Math.floor(r.width)), h: Math.max(8, Math.floor(r.height)) }; }

// renderer
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// scene + cameras
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1320);

const editorCam = new THREE.PerspectiveCamera(60,1,0.1,2000);
editorCam.position.set(7,5,9);
const gameCam = new THREE.PerspectiveCamera(75,1,0.1,2000);
gameCam.position.set(0,2,5);
let activeCam = editorCam;

// controls
const orbit = new OrbitControls(editorCam, renderer.domElement);
orbit.enableDamping = true; orbit.dampingFactor = 0.06;
orbit.target.set(0,1,0);

// env map
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const room = new RoomEnvironment();
const envMap = pmrem.fromScene(room, 0.04).texture;
scene.environment = envMap;

// helpers + lights + ground
const grid = new THREE.GridHelper(80,80,'#18455f','#0f2230');
grid.material.opacity = 0.45; grid.material.transparent = true; scene.add(grid);
const axes = new THREE.AxesHelper(2); scene.add(axes);

const hemi = new THREE.HemisphereLight(0xbfeaff, 0x081b2b, 0.6); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, 1.2); dir.position.set(6,20,8); dir.castShadow=true; dir.shadow.mapSize.set(2048,2048); dir.shadow.bias = -0.0005; scene.add(dir);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({ color:0x1c2730, roughness:0.95, metalness:0 })
);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; ground.name = "Ground"; scene.add(ground);

// postprocessing FXAA
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, activeCam);
composer.addPass(renderPass);
const fxaa = new ShaderPass(FXAAShader);
composer.addPass(fxaa);
function setFXAA(){ const { w,h } = getViewportSize(); fxaa.material.uniforms['resolution'].value.set(1/(w*renderer.getPixelRatio()), 1/(h*renderer.getPixelRatio())); }

// transform controls
const transform = new TransformControls(activeCam, renderer.domElement);
transform.addEventListener('dragging-changed', e => { orbit.enabled = !e.value; });
transform.setSize(1.0);
scene.add(transform);

// loader
const gltfLoader = new GLTFLoader();

// tiny ECS
const Systems = [];
function addSystem(fn){ Systems.push(fn); }
function tick(dt){ for(const s of Systems) s(dt); }
addSystem(dt => { scene.traverse(o => { if(o.userData.rotate) o.rotation.y += dt * 0.6; }); });

// selection / hierarchy / inspector
let selected = null;
function listables(o){ return o.visible && o !== grid && o !== axes && o !== transform && o !== editorCam && o !== gameCam && o !== pmrem && o !== room; }

function refreshHierarchy(){
  hierarchyEl.innerHTML = '';
  scene.children.filter(listables).forEach(obj => {
    const el = document.createElement('div');
    el.className = 'hierarchy-item' + (selected === obj ? ' active' : '');
    el.textContent = obj.name || obj.type;
    el.onclick = () => select(obj);
    hierarchyEl.appendChild(el);
  });
}
function select(obj){
  selected = obj;
  selectionInfo.textContent = obj ? `${obj.name || obj.type} <${obj.type}>` : 'None';
  transform.detach();
  if(obj && obj.isObject3D) transform.attach(obj);
  updateInspector(obj);
  refreshHierarchy();
}
function updateInspector(o){
  if(!o){ inspector.posX.value=inspector.posY.value=inspector.posZ.value=''; inspector.rotX.value=inspector.rotY.value=inspector.rotZ.value=''; inspector.scaleU.value=1; return; }
  inspector.posX.value = o.position.x.toFixed(2);
  inspector.posY.value = o.position.y.toFixed(2);
  inspector.posZ.value = o.position.z.toFixed(2);
  inspector.rotX.value = THREE.MathUtils.radToDeg(o.rotation.x).toFixed(1);
  inspector.rotY.value = THREE.MathUtils.radToDeg(o.rotation.y).toFixed(1);
  inspector.rotZ.value = THREE.MathUtils.radToDeg(o.rotation.z).toFixed(1);
  inspector.scaleU.value = o.scale.x.toFixed(2);
  if(o.material && o.material.color){
    inspector.matColor.value = '#' + o.material.color.getHexString();
    inspector.rough.value = (o.material.roughness ?? 0.6);
    inspector.metal.value = (o.material.metalness ?? 0.1);
  }
}
function bindNumber(el, fn){ el.addEventListener('input', ()=>{ if(!selected) return; const v = parseFloat(el.value || 0); fn(selected, v); }); }
bindNumber(inspector.posX, (o,v)=> o.position.x = v);
bindNumber(inspector.posY, (o,v)=> o.position.y = v);
bindNumber(inspector.posZ, (o,v)=> o.position.z = v);
bindNumber(inspector.rotX, (o,v)=> o.rotation.x = THREE.MathUtils.degToRad(v));
bindNumber(inspector.rotY, (o,v)=> o.rotation.y = THREE.MathUtils.degToRad(v));
bindNumber(inspector.rotZ, (o,v)=> o.rotation.z = THREE.MathUtils.degToRad(v));
bindNumber(inspector.scaleU, (o,v)=> { o.scale.setScalar(Math.max(0.001, v)); });
inspector.matColor.addEventListener('input', ()=> { if(selected?.material?.color) selected.material.color.set(inspector.matColor.value); });
inspector.rough.addEventListener('input', ()=> { if(selected?.material) { selected.material.roughness = parseFloat(inspector.rough.value); selected.material.needsUpdate = true; }});
inspector.metal.addEventListener('input', ()=> { if(selected?.material) { selected.material.metalness = parseFloat(inspector.metal.value); selected.material.needsUpdate = true; }});

// primitives
function standardMat(hex=0x6aa4ff){ const m = new THREE.MeshStandardMaterial({ color: hex, roughness:0.6, metalness:0.1 }); m.envMap = scene.environment; m.envMapIntensity = 1.0; return m; }
function addCube(){ const mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), standardMat()); mesh.castShadow = mesh.receiveShadow = true; mesh.name = `Cube_${Math.floor(Math.random()*9000)+100}`; mesh.position.set((Math.random()*4)-2,0.5,(Math.random()*4)-2); scene.add(mesh); refreshHierarchy(); select(mesh); log('Added', mesh.name); return mesh; }
function addPlane(){ const p = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({ color:0x222a30, roughness:0.95 })); p.rotation.x=-Math.PI/2; p.receiveShadow=true; p.name='Platform'; scene.add(p); refreshHierarchy(); select(p); log('Added platform'); return p; }
function addLight(){ const l = new THREE.PointLight(0xffffff,1.8,50); l.position.set(2,4,2); l.castShadow=true; l.name=`Light_${Math.floor(Math.random()*900)}`; const helper = new THREE.PointLightHelper(l,0.25); l.add(helper); scene.add(l); refreshHierarchy(); select(l); log('Added light'); return l; }

// import GLTF
function importGLTFFile(file){
  if(!file) return;
  const url = URL.createObjectURL(file);
  gltfLoader.load(url, gltf => {
    const root = gltf.scene; root.name = file.name.replace(/\.(gltf|glb)$/i,'');
    root.traverse(n => { if(n.isMesh){ n.castShadow = true; n.receiveShadow = true; if(n.material){ n.material.envMap = scene.environment; n.material.envMapIntensity = 1.0; } } });
    scene.add(root); refreshHierarchy(); select(root); URL.revokeObjectURL(url); log('Imported', file.name);
  }, undefined, err => { log('GLTF error', err.message || err); });
}
canvas.addEventListener('dragover', e => e.preventDefault());
canvas.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files?.[0]; if(f) importGLTFFile(f); });

// file input wiring
fileGLTF.addEventListener('change', e => { const f = e.target.files?.[0]; if(f) importGLTFFile(f); e.target.value=''; });
fileLoad.addEventListener('change', e => { const f = e.target.files?.[0]; if(!f) return; const r = new FileReader(); r.onload = ()=> loadFromJSON(r.result); r.readAsText(f); e.target.value=''; });

// raycast selection
const ray = new THREE.Raycaster(); const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', ev => {
  if(ev.button !== 0) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - rect.left)/rect.width)*2 - 1;
  pointer.y = -((ev.clientY - rect.top)/rect.height)*2 + 1;
  ray.setFromCamera(pointer, activeCam);
  const hits = ray.intersectObjects(scene.children, true);
  const first = hits.find(h => listables(h.object));
  if(first){
    let obj = first.object; while(obj && !obj.name && obj.parent) obj = obj.parent;
    select(obj || first.object);
  } else select(null);
});

// camera toggle
let usingGameCam = false;
const btnCam = document.getElementById('btnCam');
function setActiveCamera(cam){ activeCam = cam; renderPass.camera = cam; transform.camera = cam; onResize(); log('Active Cam:', cam===gameCam? 'Game' : 'Editor'); }
btnCam.addEventListener('click', ()=> { usingGameCam = !usingGameCam; btnCam.textContent = 'Cam: ' + (usingGameCam? 'Game' : 'Editor'); setActiveCamera(usingGameCam? gameCam : editorCam); });

// game cam controls
const keys = new Set(); let speed = 5;
window.addEventListener('keydown', e => { if(e.key === 'Shift') speed = 12; keys.add(e.code); if(e.code === 'KeyF' && selected) { orbit.target.copy(selected.position); }});
window.addEventListener('keyup', e => { if(e.key === 'Shift') speed = 5; keys.delete(e.code); });
function updateGameCam(dt){
  if(!usingGameCam) return;
  const move = new THREE.Vector3(); const forward = new THREE.Vector3(); gameCam.getWorldDirection(forward);
  const right = new THREE.Vector3().crossVectors(forward, gameCam.up).normalize();
  if(keys.has('KeyW')) move.add(forward);
  if(keys.has('KeyS')) move.addScaledVector(forward, -1);
  if(keys.has('KeyA')) move.addScaledVector(right, -1);
  if(keys.has('KeyD')) move.add(right);
  if(keys.has('KeyQ')) move.addScaledVector(new THREE.Vector3(0,1,0), -1);
  if(keys.has('KeyE')) move.add(new THREE.Vector3(0,1,0));
  if(move.lengthSq()>0){ move.normalize(); gameCam.position.addScaledVector(move, speed * dt); }
}
// mouse look for game cam
let rmb=false,lastX=0,lastY=0;
canvas.addEventListener('pointerdown', e => { if(e.button === 2){ rmb=true; lastX=e.clientX; lastY=e.clientY; canvas.setPointerCapture(e.pointerId);} });
canvas.addEventListener('pointerup', e => { if(e.button === 2){ rmb=false; canvas.releasePointerCapture(e.pointerId);} });
canvas.addEventListener('pointermove', e => { if(!rmb || !usingGameCam) return; const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; const rot=new THREE.Euler(dy * -0.002, dx * -0.002, 0, 'YXZ'); const q=new THREE.Quaternion().setFromEuler(rot); gameCam.quaternion.multiply(q); });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// gizmo shortcuts
document.getElementById('btnGizmoT').addEventListener('click', ()=> transform.setMode('translate'));
document.getElementById('btnGizmoR').addEventListener('click', ()=> transform.setMode('rotate'));
document.getElementById('btnGizmoS').addEventListener('click', ()=> transform.setMode('scale'));
document.getElementById('btnSnap').addEventListener('click', ()=> transform.setTranslationSnap(transform.getTranslationSnap()? null : 0.5));
window.addEventListener('keydown', e => { if(e.target.tagName==='INPUT') return; if(e.code==='Digit1') transform.setMode('translate'); if(e.code==='Digit2') transform.setMode('rotate'); if(e.code==='Digit3') transform.setMode('scale'); if(e.shiftKey) transform.setTranslationSnap(0.5); else transform.setTranslationSnap(null); });

// UI buttons
document.getElementById('btnAddCube').onclick = addCube;
document.getElementById('btnAddPlane').onclick = addPlane;
document.getElementById('btnAddLight').onclick = addLight;
document.getElementById('btnSave').onclick = ()=> {
  const json = JSON.stringify(scene.toJSON());
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type:'application/json' })); a.download = 'scene.json'; a.click();
};

// tone mapping + exposure
const toneSelect = document.getElementById('toneMapping');
const exposure = document.getElementById('exposure');
function applyTone(){ const v = parseInt(toneSelect.value,10); renderer.toneMapping = [THREE.NoToneMapping, THREE.ACESFilmicToneMapping, THREE.ReinhardToneMapping, THREE.CineonToneMapping, THREE.LinearToneMapping][v]; renderer.toneMappingExposure = parseFloat(exposure.value); }
toneSelect.oninput = applyTone; exposure.oninput = applyTone; applyTone();

// save/load JSON
function loadFromJSON(json){
  try{
    const loader = new THREE.ObjectLoader();
    const data = JSON.parse(json);
    scene.children.slice().forEach(ch => { if(ch !== grid && ch !== axes && ch !== transform && ch !== hemi && ch !== dir && ch !== ground) scene.remove(ch); });
    const parsed = loader.parse(data);
    parsed.children.forEach(c => { if(c.type !== 'Scene') scene.add(c); });
    refreshHierarchy(); select(null); log('Scene loaded from JSON');
  }catch(e){ log('failed load', e.message); }
}

// resize
function onResize(){
  const { w,h } = getViewportSize();
  renderer.setSize(w,h,false);
  editorCam.aspect = w/h; editorCam.updateProjectionMatrix();
  gameCam.aspect = w/h; gameCam.updateProjectionMatrix();
  composer.setSize(w,h);
  setFXAA();
  // mini renderer size
  const mr = getMiniSize();
  miniRenderer.setSize(mr.w, mr.h, false);
  miniCam.left = -miniSizeScale; miniCam.right = miniSizeScale; miniCam.top = miniSizeScale * (mr.h/mr.w); miniCam.bottom = -miniSizeScale * (mr.h/mr.w); miniCam.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

// --------- MINIMAP / VIEWFIELD setup ----------
// We'll render a second, lightweight orthographic scene view from top (and optionally show active camera frustum)
// Use a separate renderer using same WebGL context via setScissor / viewport to avoid creating multiple WebGL contexts.
const miniRenderer = new THREE.WebGLRenderer({ canvas: miniCanvas, antialias: true, alpha: true, powerPreference:'high-performance' });
miniRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
miniRenderer.autoClear = false; // we'll clear explicitly
// orthographic top-down
const miniCam = new THREE.OrthographicCamera(-10,10,10,-10,0.1, 500);
miniCam.position.set(0, 40, 0);
miniCam.up.set(0,0,-1);
miniCam.lookAt(0,0,0);
let miniSizeScale = 10; // controls zoom of mini-map

// helper objects for mini view: we reuse the main scene but will draw from top; to show camera frustum we create a simple gizmo
function drawMiniView(){
  const mr = getMiniSize();
  miniRenderer.setClearColor(0x07101a, 0);
  miniRenderer.setScissorTest(false);
  miniRenderer.clear(true, true);
  // render scene from miniCam
  miniRenderer.render(scene, miniCam);
  // overlay: draw camera frustum (editorCam or gameCam) as a simple line box
  // We'll add a helper mesh each frame (cheap for small scenes) — remove previous if any
  // Build frustum lines for active camera
  const frust = new THREE.Frustum();
  const projScreenMatrix = new THREE.Matrix4().multiplyMatrices(activeCam.projectionMatrix, activeCam.matrixWorldInverse);
  frust.setFromProjectionMatrix(projScreenMatrix); // not directly useful for lines; instead create a box approximating camera near/far corners
}
// -------------- end mini view setup --------------

// frame loop
let last = performance.now();
function animate(t){
  const dt = (t - last) / 1000; last = t;
  orbit.enabled = !usingGameCam && !transform.dragging;
  orbit.update();
  updateGameCam(dt);
  tick(dt);
  // render main
  renderPass.camera = activeCam;
  transform.camera = activeCam;
  composer.render();
  // render mini view: we'll render same scene from miniCam into miniCanvas
  miniRenderer.setViewport(0,0, miniCanvas.width, miniCanvas.height);
  miniRenderer.setScissor(0,0, miniCanvas.width, miniCanvas.height);
  miniRenderer.clear(true, true);
  miniRenderer.render(scene, miniCam);
  // draw a simple marker for active camera position on mini map
  drawCameraMarkerOnMini(activeCam);
  requestAnimationFrame(animate);
}
onResize();
requestAnimationFrame(animate);

// draw camera marker on mini: simple 2D overlay using canvas 2D for clarity
const mini2d = miniCanvas.getContext('2d');
function drawCameraMarkerOnMini(cam){
  // project camera position into miniCam NDC
  const pos = cam.position.clone();
  const proj = pos.clone().project(miniCam);
  const x = Math.round((proj.x * 0.5 + 0.5) * miniCanvas.width);
  const y = Math.round(( -proj.y * 0.5 + 0.5) * miniCanvas.height);
  // clear overlay area
  mini2d.clearRect(0,0,miniCanvas.width, miniCanvas.height);
  // draw small marker
  mini2d.fillStyle = '#6cf';
  mini2d.beginPath(); mini2d.arc(x, y, 4, 0, Math.PI*2); mini2d.fill();
  // optionally draw camera forward dir
  const forward = new THREE.Vector3(); cam.getWorldDirection(forward);
  const tip = cam.position.clone().add(forward.clone().multiplyScalar(3)).project(miniCam);
  const tx = Math.round((tip.x * 0.5 + 0.5) * miniCanvas.width);
  const ty = Math.round(( -tip.y * 0.5 + 0.5) * miniCanvas.height);
  mini2d.strokeStyle = '#6cf';
  mini2d.lineWidth = 2;
  mini2d.beginPath(); mini2d.moveTo(x,y); mini2d.lineTo(tx,ty); mini2d.stroke();
}

// basic visible boot objects to avoid blank editor
addPlane();
const demoCube = addCube();
demoCube.userData.rotate = false;
demoCube.position.set(0,1,0);
refreshHierarchy();
select(demoCube);
log('Ready — Use Import or drag & drop .glb to bring models in.');

// expose API
window.DRGE = { THREE, scene, editorCam, gameCam, renderer, addCube, addPlane, addLight, importGLTFFile, select, refreshHierarchy };
