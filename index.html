<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRGE – Web 3D Engine Starter</title>
  <style>
    :root { --bg:#0b0e13; --panel:#121722; --muted:#8aa0b6; --accent:#6cf; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: #e6eef7; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif; }
    .app { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 56px 1fr 140px; height: 100%; }
    header { grid-column: 1 / -1; background: var(--panel); display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #1f2a3a; }
    header .brand { font-weight: 800; letter-spacing: .5px; }
    header button, .toolbar button { background: #182133; color: #e6eef7; border: 1px solid #243148; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
    header button:hover, .toolbar button:hover { border-color: #33507a; }
    aside { background: var(--panel); border-right: 1px solid #1f2a3a; overflow: auto; }
    .section { padding: 10px; border-bottom: 1px solid #1f2a3a; }
    .section h3 { margin: 6px 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .hierarchy-item { padding: 6px 8px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .hierarchy-item:hover { background: #0e1421; }
    .hierarchy-item.active { background: #0e2033; outline: 1px solid #254564; }
    main { position: relative; background: #0a0d12; }
    #viewport { position: absolute; inset: 0; }
    .toolbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; backdrop-filter: blur(8px); background: rgba(16,24,39,.6); padding: 8px; border-radius: 12px; border: 1px solid #26354f; }
    .inspector { padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .inspector label { font-size: 11px; color: var(--muted); }
    .inspector input { width: 100%; background: #0e1624; border: 1px solid #22314a; color: #e6eef7; border-radius: 8px; padding: 8px; }
    footer { grid-column: 1 / -1; background: var(--panel); border-top: 1px solid #1f2a3a; display: grid; grid-template-columns: 280px 1fr; }
    .console { padding: 8px 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: auto; white-space: pre-wrap; }
    .muted { color: var(--muted); }
    input[type="file"] { display: none; }
    .badge { padding: 2px 6px; border: 1px solid #28486a; border-radius: 999px; font-size: 10px; color: var(--accent); }
    a.link { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Dynamic Rise – Web Engine (Starter)</div>
      <button id="btnAddCube">+ Cube</button>
      <button id="btnAddLight">+ Light</button>
      <button id="btnAddPlane">+ Plane</button>
      <button id="btnPlay">Play</button>
      <button id="btnPause" disabled>Pause</button>
      <button id="btnSave">Save Scene</button>
      <label for="fileLoad" class="badge" style="cursor:pointer">Load Scene</label>
      <input id="fileLoad" type="file" accept="application/json" />
      <label for="fileGLTF" class="badge" style="cursor:pointer">Import glTF</label>
      <input id="fileGLTF" type="file" accept=".gltf,.glb,model/gltf-binary,model/gltf+json" />
      <div style="margin-left:auto" class="muted">Renderer: WebGL (three.js) • Format: glTF • Scripting: JS</div>
    </header>

    <aside>
      <div class="section">
        <h3>Hierarchy</h3>
        <div id="hierarchy"></div>
      </div>
      <div class="section">
        <h3>Inspector</h3>
        <div class="inspector">
          <label>Pos X<input id="posX" type="number" step="0.1"></label>
          <label>Pos Y<input id="posY" type="number" step="0.1"></label>
          <label>Pos Z<input id="posZ" type="number" step="0.1"></label>
          <label>Rot X<input id="rotX" type="number" step="1"></label>
          <label>Rot Y<input id="rotY" type="number" step="1"></label>
          <label>Rot Z<input id="rotZ" type="number" step="1"></label>
        </div>
      </div>
    </aside>

    <main>
      <canvas id="viewport"></canvas>
      <div class="toolbar">
        <button id="btnGrid">Toggle Grid</button>
        <button id="btnAxes">Toggle Axes</button>
        <button id="btnSky">Toggle Sky</button>
      </div>
    </main>

    <footer>
      <div class="section" style="border-right:1px solid #1f2a3a">
        <h3>Selection</h3>
        <div id="selectionInfo" class="muted">None</div>
      </div>
      <div class="console" id="console"></div>
    </footer>
  </div>

  <script type="module">
    // --- Imports (three.js from CDN) ---
    import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';

    // --- Tiny logger ---
    const logEl = document.getElementById('console');
    const log = (...args) => { const s = args.map(a=>typeof a==='string'?a:JSON.stringify(a,null,2)).join(' '); logEl.textContent += `\n${s}`; logEl.scrollTop = logEl.scrollHeight; };
    log('DRGE starter booting…');

    // --- Core Engine Setup ---
    const canvas = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(window.innerWidth - 280, window.innerHeight - 56 - 140);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0d12);

    const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(5, 3, 6);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const grid = new THREE.GridHelper(20, 20, 0x335577, 0x223344); grid.visible = true; scene.add(grid);
    const axes = new THREE.AxesHelper(2); axes.visible = true; scene.add(axes);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x223344, 0.7); scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.8); dir.position.set(5,8,3); scene.add(dir);

    const loader = new GLTFLoader();

    // --- Resize ---
    function resize() {
      const w = window.innerWidth - 280; // minus sidebar
      const h = window.innerHeight - 56 - 140; // minus header + footer
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);

    // --- ECS-lite ---
    const Systems = [];
    function addSystem(fn){ Systems.push(fn); }
    function tick(dt){ Systems.forEach(s => s(dt)); }
    // Example rotate tag system
    addSystem((dt)=>{
      scene.traverse(obj=>{ if(obj.userData.rotate){ obj.rotation.y += dt * 0.6; }});
    });

    // --- Selection + Hierarchy ---
    const hierarchyEl = document.getElementById('hierarchy');
    const selectionInfo = document.getElementById('selectionInfo');
    const inspector = {
      posX: document.getElementById('posX'), posY: document.getElementById('posY'), posZ: document.getElementById('posZ'),
      rotX: document.getElementById('rotX'), rotY: document.getElementById('rotY'), rotZ: document.getElementById('rotZ')
    };
    let selected = null;

    function refreshHierarchy(){
      hierarchyEl.innerHTML = '';
      scene.children.filter(o=>o.name && o.type!=='GridHelper' && o.type!=='AxesHelper').forEach(obj=>{
        const div = document.createElement('div');
        div.className = 'hierarchy-item' + (selected===obj?' active':'');
        div.textContent = `${obj.name} • ${obj.type}`;
        div.onclick = ()=> select(obj);
        hierarchyEl.appendChild(div);
      });
    }

    function select(obj){
      selected = obj; refreshHierarchy();
      selectionInfo.textContent = obj ? `${obj.name} <${obj.type}>` : 'None';
      if(!obj) return;
      inspector.posX.value = obj.position.x.toFixed(2);
      inspector.posY.value = obj.position.y.toFixed(2);
      inspector.posZ.value = obj.position.z.toFixed(2);
      inspector.rotX.value = THREE.MathUtils.radToDeg(obj.rotation.x).toFixed(1);
      inspector.rotY.value = THREE.MathUtils.radToDeg(obj.rotation.y).toFixed(1);
      inspector.rotZ.value = THREE.MathUtils.radToDeg(obj.rotation.z).toFixed(1);
    }

    // Inspector bindings
    function bindNumber(el, getter, setter){
      el.addEventListener('input', ()=>{
        const v = parseFloat(el.value || '0');
        if(selected){ setter(selected, v); }
      });
    }
    bindNumber(inspector.posX, o=>o.position.x, (o,v)=>o.position.x=v);
    bindNumber(inspector.posY, o=>o.position.y, (o,v)=>o.position.y=v);
    bindNumber(inspector.posZ, o=>o.position.z, (o,v)=>o.position.z=v);
    bindNumber(inspector.rotX, o=>o.rotation.x, (o,v)=>o.rotation.x=THREE.MathUtils.degToRad(v));
    bindNumber(inspector.rotY, o=>o.rotation.y, (o,v)=>o.rotation.y=THREE.MathUtils.degToRad(v));
    bindNumber(inspector.rotZ, o=>o.rotation.z, (o,v)=>o.rotation.z=THREE.MathUtils.degToRad(v));

    // --- Primitives
    function addCube(){
      const geo = new THREE.BoxGeometry(1,1,1);
      const mat = new THREE.MeshStandardMaterial({ color: 0x4488ff, metalness: .1, roughness: .6 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.name = `Cube_${Math.floor(Math.random()*999)}`;
      mesh.position.set((Math.random()*4)-2, 0.5, (Math.random()*4)-2);
      scene.add(mesh); refreshHierarchy(); select(mesh); return mesh;
    }
    function addPlane(){
      const geo = new THREE.PlaneGeometry(20,20);
      const mat = new THREE.MeshStandardMaterial({ color: 0x223344, metalness: .0, roughness: .9 });
      const mesh = new THREE.Mesh(geo, mat); mesh.rotation.x = -Math.PI/2; mesh.receiveShadow = true; mesh.name='Ground';
      scene.add(mesh); refreshHierarchy(); select(mesh); return mesh;
    }
    function addLight(){
      const l = new THREE.PointLight(0xffffff, 1, 100); l.position.set(2,3,2); l.name = 'PointLight';
      const helper = new THREE.PointLightHelper(l, 0.2); l.add(helper);
      scene.add(l); refreshHierarchy(); select(l); return l;
    }

    // --- Import glTF
    function importGLTF(file){
      const url = URL.createObjectURL(file);
      loader.load(url, (gltf)=>{
        const root = gltf.scene; root.name = file.name.replace(/\.(gltf|glb)$/i,'');
        scene.add(root); refreshHierarchy(); select(root); URL.revokeObjectURL(url);
        log('Imported', file.name);
      }, undefined, (err)=>{ log('GLTF error', err.message || err); });
    }

    // --- Save / Load Scene (JSON)
    function serialize(){
      // use three's native toJSON
      const data = scene.toJSON();
      return JSON.stringify(data);
    }
    function download(filename, text){
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'application/json'})); a.download = filename; a.click();
    }
    function loadFromJSON(json){
      try {
        const loader = new THREE.ObjectLoader();
        const data = JSON.parse(json);
        // clear current scene (except helpers)
        scene.children.slice().forEach(ch=>{ if(!(ch instanceof THREE.HemisphereLight) && ch!==grid && ch!==axes && ch!==dir) scene.remove(ch); });
        const restored = loader.parse(data);
        // Transfer children only, keep our lights/helpers/camera
        restored.children.forEach(ch=>{ if(ch.type!=='Scene') scene.add(ch); });
        refreshHierarchy(); select(null);
        log('Scene loaded from JSON');
      } catch(e){ log('Load error', e.message); }
    }

    // --- Toggle helpers
    document.getElementById('btnGrid').onclick = ()=>{ grid.visible = !grid.visible; };
    document.getElementById('btnAxes').onclick = ()=>{ axes.visible = !axes.visible; };
    document.getElementById('btnSky').onclick = ()=>{ scene.background = scene.background ? null : new THREE.Color(0x0a0d12); };

    // --- UI wiring
    document.getElementById('btnAddCube').onclick = addCube;
    document.getElementById('btnAddPlane').onclick = addPlane;
    document.getElementById('btnAddLight').onclick = addLight;
    document.getElementById('btnSave').onclick = ()=> download('scene.json', serialize());
    document.getElementById('fileLoad').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(!file) return; const reader = new FileReader();
      reader.onload = ()=> loadFromJSON(reader.result); reader.readAsText(file);
      e.target.value = '';
    });
    document.getElementById('fileGLTF').addEventListener('change', (e)=>{
      const file = e.target.files[0]; if(file) importGLTF(file); e.target.value='';
    });

    // --- Raycast select with click ---
    const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
    renderer.domElement.addEventListener('pointerdown', (ev)=>{
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(scene.children, true);
      const first = hits.find(h=> h.object.type !== 'GridHelper' && h.object.type !== 'AxesHelper');
      if(first){
        // walk up to a named parent
        let o = first.object; while(o && !o.name) o = o.parent; select(o || first.object);
      }
    });

    // --- Play/Pause loop ---
    let running = false; let last = performance.now();
    function frame(t){
      const dt = (t - last) / 1000; last = t;
      controls.update();
      if(running) tick(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    const btnPlay = document.getElementById('btnPlay');
    const btnPause = document.getElementById('btnPause');
    btnPlay.onclick = ()=>{ running = true; btnPlay.disabled = true; btnPause.disabled = false; log('Play'); };
    btnPause.onclick = ()=>{ running = false; btnPlay.disabled = false; btnPause.disabled = true; log('Pause'); };

    // --- Boot demo content ---
    addPlane();
    const c = addCube(); c.userData.rotate = true;
    refreshHierarchy();
    resize();

    // --- Public API (for future modules/editor integration) ---
    window.DRGE = {
      THREE, scene, camera, renderer, controls,
      addCube, addPlane, addLight,
      serialize, loadFromJSON,
      addSystem, log
    };

    log('Ready. Tip: use window.DRGE in DevTools.');
  </script>
</body>
</html>
