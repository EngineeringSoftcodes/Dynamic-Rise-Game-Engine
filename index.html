<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Rise™ Engine</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #ddd;
      overflow: hidden;
    }
    #topbar {
      height: 40px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-bottom: 1px solid #333;
    }
    #topbar button {
      margin-right: 10px;
      background: #222;
      border: 1px solid #444;
      color: #ddd;
      padding: 5px 10px;
      cursor: pointer;
    }
    #editor {
      display: grid;
      grid-template-columns: 200px 1fr 250px;
      grid-template-rows: 1fr 150px;
      height: calc(100vh - 40px);
    }
    #hierarchy {
      grid-row: 1 / 2;
      background: #181818;
      border-right: 1px solid #333;
      padding: 5px;
    }
    #viewport {
      grid-row: 1 / 2;
      background: #000;
      position: relative;
    }
    #inspector {
      grid-row: 1 / 2;
      background: #181818;
      border-left: 1px solid #333;
      padding: 5px;
    }
    #console {
      grid-column: 1 / 4;
      grid-row: 2 / 3;
      background: #141414;
      border-top: 1px solid #333;
      padding: 5px;
      overflow-y: auto;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <button onclick="addCube()">+ Cube</button>
    <button onclick="addLight()">+ Light</button>
  </div>
  <div id="editor">
    <div id="hierarchy"><b>Hierarchy</b><ul id="objectList"></ul></div>
    <div id="viewport"></div>
    <div id="inspector"><b>Inspector</b><div id="inspectorContent">Select an object</div></div>
    <div id="console"><b>Console</b><div id="logs"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101018);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight-190), 0.1, 1000);
    camera.position.set(5, 5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth-450, window.innerHeight-190);
    document.getElementById("viewport").appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Grid + Axes
    const grid = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
    scene.add(grid);
    const axes = new THREE.AxesHelper(5);
    scene.add(axes);

    // Light
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Object tracking
    let objects = [];
    const objectList = document.getElementById("objectList");
    const inspectorContent = document.getElementById("inspectorContent");
    const logs = document.getElementById("logs");

    function log(msg) {
      logs.innerHTML += msg + "<br>";
      logs.scrollTop = logs.scrollHeight;
    }

    // Add Cube
    function addCube() {
      const geo = new THREE.BoxGeometry(1,1,1);
      const mat = new THREE.MeshStandardMaterial({ color: 0x00aaff });
      const cube = new THREE.Mesh(geo, mat);
      cube.name = "Cube " + (objects.length+1);
      scene.add(cube);
      objects.push(cube);
      updateHierarchy();
      log("Added " + cube.name);
    }

    // Add Light
    function addLight() {
      const light = new THREE.PointLight(0xffffff, 1, 100);
      light.position.set(2,2,2);
      light.name = "Light " + (objects.length+1);
      scene.add(light);
      objects.push(light);
      updateHierarchy();
      log("Added " + light.name);
    }

    // Update Hierarchy
    function updateHierarchy() {
      objectList.innerHTML = "";
      objects.forEach((obj, i) => {
        const li = document.createElement("li");
        li.textContent = obj.name;
        li.style.cursor = "pointer";
        li.onclick = () => selectObject(obj);
        objectList.appendChild(li);
      });
    }

    let selected = null;
    function selectObject(obj) {
      selected = obj;
      inspectorContent.innerHTML = `
        <p><b>${obj.name}</b></p>
        <p>Type: ${obj.type}</p>
        <p>Position: 
          x <input type="number" step="0.1" value="${obj.position.x}" 
             onchange="selected.position.x=parseFloat(this.value)">
          y <input type="number" step="0.1" value="${obj.position.y}" 
             onchange="selected.position.y=parseFloat(this.value)">
          z <input type="number" step="0.1" value="${obj.position.z}" 
             onchange="selected.position.z=parseFloat(this.value)">
        </p>
      `;
      log("Selected " + obj.name);
    }

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = (window.innerWidth-450)/(window.innerHeight-190);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth-450, window.innerHeight-190);
    });
  </script>
</body>
</html>
