<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Rise™ Engine Prototype</title>
<style>
  :root {
    --bg:#0a0e14;
    --panel:#0f1420;
    --panel2:#0b101a;
    --accent:#6cf;
    --muted:#8aa0b6;
    --line:#1f2a3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:system-ui,sans-serif;color:#e6eef7;background:var(--bg);}
  .app{display:grid;grid-template-columns:300px 1fr 320px;grid-template-rows:56px 1fr 160px;height:100%;}
  header{grid-column:1/-1;background:linear-gradient(180deg,#12192a,#0f1522);display:flex;align-items:center;padding:8px;gap:10px;border-bottom:1px solid var(--line);}
  .btn{background:#172238;border:1px solid #26354f;color:#e6eef7;padding:6px 12px;border-radius:8px;cursor:pointer;}
  .spacer{flex:1;}
  aside{overflow:auto;}
  .left{background:var(--panel);border-right:1px solid var(--line);}
  .right{background:var(--panel);border-left:1px solid var(--line);}
  main{position:relative;background:radial-gradient(1200px 600px at 60% 30%,#121a2c 0%,#0a0e14 55%);}
  #viewport{position:absolute;inset:0;outline:none;}
  .toolbar{position:absolute;top:10px;left:10px;display:flex;gap:8px;background:rgba(16,24,39,0.6);padding:6px;border-radius:12px;}
  .statusbar{grid-column:1/-1;background:var(--panel2);display:grid;grid-template-columns:300px 1fr 320px;border-top:1px solid var(--line);}
  .console{padding:8px;font-family:monospace;overflow:auto;white-space:pre-wrap;}
  .section{padding:10px;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Dynamic Rise™ Engine</div>
    <button class="btn" id="addCube">+ Cube</button>
    <button class="btn" id="addPlane">+ Plane</button>
    <button class="btn" id="addLight">+ Light</button>
    <div class="spacer"></div>
    <button class="btn" id="saveScene">Save</button>
  </header>

  <aside class="left">
    <div class="section">
      <h3>Hierarchy</h3>
      <div id="hierarchy"></div>
    </div>
  </aside>

  <main>
    <canvas id="viewport" tabindex="0"></canvas>
    <div class="toolbar">WASD: Move • 1/2/3: Gizmo</div>
  </main>

  <aside class="right">
    <div class="section">
      <h3>Inspector</h3>
      <div id="inspector">Select an object</div>
    </div>
  </aside>

  <div class="statusbar">
    <div class="section">Selection Info</div>
    <div class="console" id="console"></div>
    <div class="section">Renderer: Three.js WebGL</div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';

// Renderer
const canvas = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth - 620, window.innerHeight - 216);

// Scene + Camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
const camera = new THREE.PerspectiveCamera(60, (window.innerWidth-620)/(window.innerHeight-216), 0.1, 1000);
camera.position.set(5,5,5);
const controls = new OrbitControls(camera, renderer.domElement);

// Helpers
const grid = new THREE.GridHelper(40,40); scene.add(grid);
const axes = new THREE.AxesHelper(5); scene.add(axes);

// Add primitives
function addCube(){ const c = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({color:0x6aa4ff})); scene.add(c); log('Added Cube'); }
function addPlane(){ const p = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({color:0x222a33})); p.rotation.x=-Math.PI/2; scene.add(p); log('Added Plane'); }
function addLight(){ const l = new THREE.PointLight(0xffffff,2); l.position.set(2,4,2); scene.add(l); log('Added Light'); }

document.getElementById('addCube').onclick = addCube;
document.getElementById('addPlane').onclick = addPlane;
document.getElementById('addLight').onclick = addLight;

// Logger
const logEl = document.getElementById('console');
function log(msg){ logEl.textContent += '\n' + msg; logEl.scrollTop = logEl.scrollHeight; }

// Animate
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();

window.addEventListener('resize', ()=>{
  renderer.setSize(window.innerWidth-620, window.innerHeight-216);
  camera.aspect = (window.innerWidth-620)/(window.innerHeight-216);
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>
