<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Rise™ Game Engine — Frostbite‑style</title>
  <style>
    :root { --bg:#0a0e14; --panel:#0f1420; --panel2:#0b101a; --muted:#8aa0b6; --accent:#6cf; --line:#1f2a3a; }
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; background:var(--bg); color:#e6eef7; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif; }
    .app{ height:100%; display:grid; grid-template-columns: 300px 1fr 320px; grid-template-rows: 56px 1fr 160px; }
    header{ grid-column:1/-1; background:linear-gradient(180deg,#12192a,#0f1522); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:8px 12px; }
    .brand{ font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    .spacer{ flex:1; }
    .btn, .chip{ background:#172238; border:1px solid #26354f; color:#e6eef7; padding:8px 10px; border-radius:10px; cursor:pointer; }
    .btn:hover{ border-color:#33507a; }
    .left{ background:var(--panel); border-right:1px solid var(--line); overflow:auto; }
    .right{ background:var(--panel); border-left:1px solid var(--line); overflow:auto; }
    .section{ padding:10px; border-bottom:1px solid var(--line); }
    .section h3{ margin:6px 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
    .hierarchy-item{ padding:6px 8px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:6px; }
    .hierarchy-item:hover{ background:#0e1421; }
    .hierarchy-item.active{ background:#0e2033; outline:1px solid #254564; }

    main{ position:relative; background:radial-gradient(1200px 600px at 60% 30%, #121a2c 0%, #0a0e14 55%); }
    #viewport{ position:absolute; inset:0; outline:none; display:block; }

    .toolbar{ position:absolute; top:10px; left:10px; display:flex; gap:8px; backdrop-filter: blur(8px); background:rgba(16,24,39,.55); padding:8px; border-radius:12px; border:1px solid #26354f; }
    .statusbar{ grid-column:1/-1; background:var(--panel2); border-top:1px solid var(--line); display:grid; grid-template-columns: 300px 1fr 320px; }
    .console{ padding:8px 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow:auto; white-space:pre-wrap; }

    .inspector{ padding:10px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .inspector label{ font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:6px; }
    .inspector input,.inspector select{ width:100%; background:#0e1624; border:1px solid #22314a; color:#e6eef7; border-radius:8px; padding:8px; }

    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .chip{ font-size:10px; border-radius:999px; padding:4px 8px; }

    input[type="file"]{ display:none; }
    a.link{ color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Dynamic Rise™ Engine</div>
      <button id="btnNew" class="btn">New</button>
      <button id="btnAddCube" class="btn">+ Cube</button>
      <button id="btnAddLight" class="btn">+ Light</button>
      <button id="btnAddPlane" class="btn">+ Plane</button>
      <div class="spacer"></div>
      <button id="btnGizmoT" class="btn" title="1">Move</button>
      <button id="btnGizmoR" class="btn" title="2">Rotate</button>
      <button id="btnGizmoS" class="btn" title="3">Scale</button>
      <button id="btnSnap" class="btn" title="Shift">Snap</button>
      <div class="spacer"></div>
      <button id="btnCamToggle" class="btn">Cam: Editor</button>
      <button id="btnSave" class="btn">Save</button>
      <label for="fileLoad" class="chip" style="cursor:pointer">Load</label>
      <input id="fileLoad" type="file" accept="application/json" />
      <label for="fileGLTF" class="chip" style="cursor:pointer">Import glTF</label>
      <input id="fileGLTF" type="file" accept=".gltf,.glb,model/gltf-binary,model/gltf+json" />
    </header>

    <aside class="left">
      <div class="section">
        <h3>Hierarchy</h3>
        <div id="hierarchy"></div>
      </div>
      <div class="section">
        <h3>Environment</h3>
        <div class="row" style="margin-bottom:8px">
          <button id="btnGrid" class="btn">Grid</button>
          <button id="btnAxes" class="btn">Axes</button>
          <button id="btnSky" class="btn">Sky</button>
        </div>
        <div class="row">
          <label class="chip">Tone
            <select id="toneMapping">
              <option value="0">None</option>
              <option value="1" selected>ACES</option>
              <option value="2">Reinhard</option>
              <option value="3">Cineon</option>
              <option value="4">Linear</option>
            </select>
          </label>
          <label class="chip">Exposure <input id="exposure" type="range" min="0.1" max="2.5" step="0.01" value="1.0"></label>
        </div>
      </div>
    </aside>

    <main>
      <canvas id="viewport" tabindex="0"></canvas>
      <div class="toolbar">
        <span class="chip">WASD: Game cam • Q/E: down/up • F: focus • 1/2/3: gizmo</span>
      </div>
    </main>

    <aside class="right">
      <div class="section">
        <h3>Inspector</h3>
        <div class="inspector">
          <label>Pos X<input id="posX" type="number" step="0.1"></label>
          <label>Pos Y<input id="posY" type="number" step="0.1"></label>
          <label>Pos Z<input id="posZ" type="number" step="0.1"></label>
          <label>Rot X<input id="rotX" type="number" step="1"></label>
          <label>Rot Y<input id="rotY" type="number" step="1"></label>
          <label>Rot Z<input id="rotZ" type="number" step="1"></label>
          <label>Scale<input id="scaleU" type="number" step="0.1" value="1"></label>
          <label>Material Color<input id="matColor" type="color" value="#6aa4ff"></label>
          <label>Roughness<input id="rough" type="range" min="0" max="1" step="0.01" value="0.6"></label>
          <label>Metalness<input id="metal" type="range" min="0" max="1" step="0.01" value="0.1"></label>
        </div>
      </div>
    </aside>

    <div class="statusbar">
      <div class="section" style="border-right:1px solid var(--line)">
        <h3>Selection</h3>
        <div id="selectionInfo" class="muted">None</div>
      </div>
      <div id="console" class="console"></div>
      <div class="section" style="border-left:1px solid var(--line)">
        <h3>Renderer</h3>
        <div class="muted">WebGL (three.js) • PBR • FXAA • EnvMap</div>
      </div>
    </div>
  </div>

  <script type="module">
    // --- Imports ---
    import * as THREE from 'https://unpkg.com/three@0.161.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';
    import { TransformControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/TransformControls.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'https://unpkg.com/three@0.161.0/examples/jsm/environments/RoomEnvironment.js';
    import { EffectComposer } from 'https://unpkg.com/three@0.161.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://unpkg.com/three@0.161.0/examples/jsm/postprocessing/RenderPass.js';
    import { ShaderPass } from 'https://unpkg.com/three@0.161.0/examples/jsm/postprocessing/ShaderPass.js';
    import { FXAAShader } from 'https://unpkg.com/three@0.161.0/examples/jsm/shaders/FXAAShader.js';

    // --- Logger ---
    const logEl = document.getElementById('console');
    const log = (...args)=>{ const s = args.map(a=>typeof a==='string'?a:JSON.stringify(a,null,2)).join(' '); logEl.textContent += `\n${s}`; logEl.scrollTop = logEl.scrollHeight; };
    log('DRGE Frostbite-style booting…');

    // --- Sizes / Resize helper (robust: uses parent rect instead of magic numbers) ---
    const canvas = document.getElementById('viewport');
    function getViewportSize(){
      const rect = canvas.parentElement.getBoundingClientRect();
      return { w: Math.max(1, rect.width), h: Math.max(1, rect.height) };
    }

    // --- Renderer ---
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const { w:vw, h:vh } = getViewportSize();
    renderer.setSize(vw, vh, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; // default vibe
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // --- Scene / Camera ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f16);

    const camera = new THREE.PerspectiveCamera(60, vw/vh, 0.1, 2000);
    camera.position.set(6, 4, 8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1, 0);

    // Game camera (free‑fly)
    const gameCam = new THREE.PerspectiveCamera(70, vw/vh, 0.1, 2000);
    gameCam.position.set(0, 2, 5);
    let activeCam = camera; // start with editor cam

    // --- Environment map (physically based) ---
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; // clean neutral env
    scene.environment = env;

    // --- World helpers ---
    const grid = new THREE.GridHelper(40, 40, 0x335577, 0x223344); grid.material.opacity = 0.5; grid.material.transparent = true; scene.add(grid);
    const axes = new THREE.AxesHelper(2); scene.add(axes);

    // Lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0x202838, 0.6); scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.0); dir.position.set(6,10,4); dir.castShadow = true; dir.shadow.mapSize.set(2048,2048); scene.add(dir);

    // --- Postprocessing (FXAA) ---
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, activeCam);
    const fxaaPass = new ShaderPass(FXAAShader);
    const setFXAA = ()=>{
      const { w, h } = getViewportSize();
      fxaaPass.material.uniforms[ 'resolution' ].value.set(1/(w*renderer.getPixelRatio()), 1/(h*renderer.getPixelRatio()));
    };
    composer.addPass(renderPass);
    composer.addPass(fxaaPass);
    setFXAA();

    // --- GLTF Loader ---
    const gltfLoader = new GLTFLoader();

    // --- Transform gizmos ---
    const gizmo = new TransformControls(activeCam, renderer.domElement);
    gizmo.addEventListener('dragging-changed', e=>{ controls.enabled = !e.value; });
    gizmo.setSize(1.1);
    scene.add(gizmo);

    // --- ECS-lite ---
    const Systems = [];
    function addSystem(fn){ Systems.push(fn); }
    function tick(dt){ for(let i=0;i<Systems.length;i++) Systems[i](dt); }

    // demo system: rotate tagged
    addSystem((dt)=>{ scene.traverse(o=>{ if(o.userData.rotate) o.rotation.y += dt*0.6; }); });

    // --- Selection / Hierarchy / Inspector ---
    const hierarchyEl = document.getElementById('hierarchy');
    const selectionInfo = document.getElementById('selectionInfo');
    const inspector = {
      posX: document.getElementById('posX'), posY: document.getElementById('posY'), posZ: document.getElementById('posZ'),
      rotX: document.getElementById('rotX'), rotY: document.getElementById('rotY'), rotZ: document.getElementById('rotZ'),
      scaleU: document.getElementById('scaleU'), matColor: document.getElementById('matColor'), rough: document.getElementById('rough'), metal: document.getElementById('metal')
    };
    let selected = null;

    function listables(o){ return o.type!=='GridHelper' && o.type!=='AxesHelper' && o !== gizmo; }

    function refreshHierarchy(){
      hierarchyEl.innerHTML = '';
      scene.children.filter(listables).forEach(obj=>{
        const div = document.createElement('div');
        div.className = 'hierarchy-item' + (selected===obj?' active':'');
        div.textContent = `${obj.name || obj.type}`;
        div.onclick = ()=> select(obj);
        hierarchyEl.appendChild(div);
      });
    }

    function select(obj){
      selected = obj; selectionInfo.textContent = obj ? `${obj.name || obj.type} <${obj.type}>` : 'None';
      gizmo.detach(); if(obj && obj.isObject3D) gizmo.attach(obj);
      if(!obj){ updateInspector(null); refreshHierarchy(); return; }
      updateInspector(obj); refreshHierarchy();
    }

    function updateInspector(o){
      const has = !!o;
      inspector.posX.value = has ? o.position.x.toFixed(2) : '';
      inspector.posY.value = has ? o.position.y.toFixed(2) : '';
      inspector.posZ.value = has ? o.position.z.toFixed(2) : '';
      inspector.rotX.value = has ? THREE.MathUtils.radToDeg(o.rotation.x).toFixed(1) : '';
      inspector.rotY.value = has ? THREE.MathUtils.radToDeg(o.rotation.y).toFixed(1) : '';
      inspector.rotZ.value = has ? THREE.MathUtils.radToDeg(o.rotation.z).toFixed(1) : '';
      inspector.scaleU.value = has ? o.scale.x.toFixed(2) : 1;
      if(has && o.material && o.material.color){ inspector.matColor.value = `#${o.material.color.getHexString()}`; inspector.rough.value = o.material.roughness ?? 0.6; inspector.metal.value = o.material.metalness ?? 0.1; }
    }

    function bindNumber(el, setter){ el.addEventListener('input', ()=>{ if(!selected) return; const v = parseFloat(el.value||'0'); setter(selected, v); }); }
    bindNumber(inspector.posX, (o,v)=>o.position.x=v);
    bindNumber(inspector.posY, (o,v)=>o.position.y=v);
    bindNumber(inspector.posZ, (o,v)=>o.position.z=v);
    bindNumber(inspector.rotX, (o,v)=>o.rotation.x=THREE.MathUtils.degToRad(v));
    bindNumber(inspector.rotY, (o,v)=>o.rotation.y=THREE.MathUtils.degToRad(v));
    bindNumber(inspector.rotZ, (o,v)=>o.rotation.z=THREE.MathUtils.degToRad(v));
    bindNumber(inspector.scaleU, (o,v)=>{ o.scale.setScalar(Math.max(0.001,v)); });
    inspector.matColor.addEventListener('input', ()=>{ if(selected && selected.material && selected.material.color){ selected.material.color.set(inspector.matColor.value); selected.material.needsUpdate = true; }});
    inspector.rough.addEventListener('input', ()=>{ if(selected?.material){ selected.material.roughness = parseFloat(inspector.rough.value); selected.material.needsUpdate=true; }});
    inspector.metal.addEventListener('input', ()=>{ if(selected?.material){ selected.material.metalness = parseFloat(inspector.metal.value); selected.material.needsUpdate=true; }});

    // --- Primitives ---
    function standardMat(color=0x6aa4ff){ const m = new THREE.MeshStandardMaterial({ color, roughness:0.6, metalness:0.1 }); m.envMapIntensity = 1.0; return m; }
    function addCube(){
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), standardMat());
      mesh.castShadow = mesh.receiveShadow = true;
      mesh.name = `Cube_${Math.floor(Math.random()*999)}`;
      mesh.position.set((Math.random()*4)-2, 0.5, (Math.random()*4)-2);
      scene.add(mesh); refreshHierarchy(); select(mesh); return mesh;
    }
    function addPlane(){
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({ color:0x222a33, roughness:.9, metalness:0 }));
      mesh.rotation.x = -Math.PI/2; mesh.receiveShadow = true; mesh.name = 'Ground';
      scene.add(mesh); refreshHierarchy(); select(mesh); return mesh;
    }
    function addLight(){
      const l = new THREE.PointLight(0xffffff, 100, 100); l.position.set(2,3,2); l.name='PointLight'; l.castShadow=true; l.shadow.mapSize.set(1024,1024);
      const helper = new THREE.PointLightHelper(l, 0.2); l.add(helper);
      scene.add(l); refreshHierarchy(); select(l); return l;
    }

    // --- Import glTF ---
    function importGLTF(file){
      const url = URL.createObjectURL(file);
      gltfLoader.load(url, (gltf)=>{
        const root = gltf.scene; root.name = file.name.replace(/\.(gltf|glb)$/i,'');
        root.traverse(n=>{ if(n.isMesh){ n.castShadow = true; n.receiveShadow = true; if(n.material) n.material.envMapIntensity = 1.0; }});
        scene.add(root); refreshHierarchy(); select(root); URL.revokeObjectURL(url);
        log('Imported', file.name);
      }, undefined, (err)=>{ log('GLTF error', err.message || err); });
    }

    // Drag & Drop to canvas
    canvas.addEventListener('dragover', e=>{ e.preventDefault(); });
    canvas.addEventListener('drop', e=>{ e.preventDefault(); const f = e.dataTransfer.files?.[0]; if(f) importGLTF(f); });

    // --- Save / Load Scene ---
    function serialize(){ const data = scene.toJSON(); return JSON.stringify(data); }
    function download(filename, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=filename; a.click(); }
    function loadFromJSON(json){
      try{
        const loader = new THREE.ObjectLoader();
        const data = JSON.parse(json);
        // clear (keep env, helpers, lights dir/hemisphere, gizmo)
        scene.children.slice().forEach(ch=>{ if(ch!==grid && ch!==axes && ch!==gizmo && ch!==hemi && ch!==dir) scene.remove(ch); });
        const restored = loader.parse(data);
        restored.children.forEach(ch=>{ if(ch.type!=='Scene') scene.add(ch); });
        refreshHierarchy(); select(null);
        log('Scene loaded');
      }catch(e){ log('Load error', e.message); }
    }

    // --- Raycast select ---
    const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
    renderer.domElement.addEventListener('pointerdown', (ev)=>{
      if(ev.button!==0) return; // left only
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((ev.clientX - rect.left)/rect.width)*2 - 1;
      mouse.y = -((ev.clientY - rect.top)/rect.height)*2 + 1;
      raycaster.setFromCamera(mouse, activeCam);
      const hits = raycaster.intersectObjects(scene.children, true);
      const first = hits.find(h=> listables(h.object));
      if(first){ let o = first.object; while(o && !o.name && o.parent && o.parent!==scene) o = o.parent; select(o||first.object); }
    });

    // --- Camera toggle (Editor ↔ Game) ---
    const btnCamToggle = document.getElementById('btnCamToggle');
    let usingGameCam = false;
    function setActiveCamera(cam){
      activeCam = cam; renderPass.camera = cam; gizmo.camera = cam; onResize(); log('Active camera:', cam===gameCam?'Game':'Editor');
    }
    btnCamToggle.onclick = ()=>{ usingGameCam = !usingGameCam; btnCamToggle.textContent = 'Cam: ' + (usingGameCam?'Game':'Editor'); setActiveCamera(usingGameCam?gameCam:camera); };

    // --- Game camera movement (WASD + QE) ---
    const keys = new Set(); let speed=5;
    window.addEventListener('keydown', (e)=>{ keys.add(e.code); if(e.shiftKey) speed=12; if(e.code==='KeyF' && selected){ controls.target.copy(selected.position); }});
    window.addEventListener('keyup', (e)=>{ keys.delete(e.code); speed=5; });
    function updateGameCam(dt){
      if(!usingGameCam) return;
      const v = new THREE.Vector3();
      const fwd = new THREE.Vector3();
      gameCam.getWorldDirection(fwd);
      const right = new THREE.Vector3().crossVectors(fwd, gameCam.up).normalize();
      const up = new THREE.Vector3(0,1,0);
      if(keys.has('KeyW')) v.add(fwd);
      if(keys.has('KeyS')) v.addScaledVector(fwd, -1);
      if(keys.has('KeyA')) v.addScaledVector(right, -1);
      if(keys.has('KeyD')) v.add(right);
      if(keys.has('KeyQ')) v.addScaledVector(up, -1);
      if(keys.has('KeyE')) v.add(up);
      if(v.lengthSq()>0){ v.normalize(); gameCam.position.addScaledVector(v, speed*dt); }
    }

    // mouse look for game cam while right mouse held
    let rmb=false; let lastX=0,lastY=0;
    canvas.addEventListener('pointerdown', e=>{ if(e.button===2){ rmb=true; lastX=e.clientX; lastY=e.clientY; canvas.setPointerCapture(e.pointerId);} });
    canvas.addEventListener('pointerup', e=>{ if(e.button===2){ rmb=false; canvas.releasePointerCapture(e.pointerId);} });
    canvas.addEventListener('pointermove', e=>{
      if(!rmb || !usingGameCam) return; const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
      const rot = new THREE.Euler( dy* -0.002, dx* -0.002, 0, 'YXZ');
      const q = new THREE.Quaternion().setFromEuler(rot); gameCam.quaternion.multiply(q);
    });
    canvas.addEventListener('contextmenu', e=> e.preventDefault());

    // --- Gizmo buttons & shortcuts ---
    document.getElementById('btnGizmoT').onclick = ()=> gizmo.setMode('translate');
    document.getElementById('btnGizmoR').onclick = ()=> gizmo.setMode('rotate');
    document.getElementById('btnGizmoS').onclick = ()=> gizmo.setMode('scale');
    document.getElementById('btnSnap').onclick = ()=> gizmo.setTranslationSnap( gizmo.getTranslationSnap()? null : 0.5 );
    window.addEventListener('keydown', (e)=>{
      if(e.target.tagName==='INPUT') return; // don't steal inputs
      if(e.code==='Digit1') gizmo.setMode('translate');
      if(e.code==='Digit2') gizmo.setMode('rotate');
      if(e.code==='Digit3') gizmo.setMode('scale');
      if(e.shiftKey) gizmo.setTranslationSnap(0.5); else gizmo.setTranslationSnap(null);
    });

    // --- UI wiring ---
    document.getElementById('btnNew').onclick = ()=>{ scene.traverse(o=>{ if(o.isMesh) o.userData.rotate=false; }); };
    document.getElementById('btnAddCube').onclick = addCube;
    document.getElementById('btnAddPlane').onclick = addPlane;
    document.getElementById('btnAddLight').onclick = addLight;
    document.getElementById('btnSave').onclick = ()=> download('scene.json', serialize());
    document.getElementById('fileLoad').addEventListener('change', (e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=> loadFromJSON(r.result); r.readAsText(f); e.target.value=''; });
    document.getElementById('fileGLTF').addEventListener('change', (e)=>{ const f=e.target.files[0]; if(f) importGLTF(f); e.target.value=''; });

    // --- Env controls ---
    document.getElementById('btnGrid').onclick = ()=> grid.visible=!grid.visible;
    document.getElementById('btnAxes').onclick = ()=> axes.visible=!axes.visible;
    document.getElementById('btnSky').onclick = ()=>{ scene.background = scene.background ? null : new THREE.Color(0x0b0f16); };
    const toneSelect = document.getElementById('toneMapping');
    const exposure = document.getElementById('exposure');
    const Tone = { None:0, ACES:1, Reinhard:2, Cineon:3, Linear:4 };
    function applyTone(){
      const v = parseInt(toneSelect.value,10);
      renderer.toneMapping = [THREE.NoToneMapping, THREE.ACESFilmicToneMapping, THREE.ReinhardToneMapping, THREE.CineonToneMapping, THREE.LinearToneMapping][v];
      renderer.toneMappingExposure = parseFloat(exposure.value);
    }
    toneSelect.oninput = applyTone; exposure.oninput = applyTone; applyTone();

    // --- Resize handling ---
    function onResize(){
      const { w, h } = getViewportSize();
      renderer.setSize(w, h, false);
      camera.aspect = w/h; camera.updateProjectionMatrix();
      gameCam.aspect = w/h; gameCam.updateProjectionMatrix();
      setFXAA();
    }
    window.addEventListener('resize', onResize);

    // --- Frame loop ---
    let running = true; // editor always rendering
    let last = performance.now();
    function frame(t){
      const dt = (t-last)/1000; last=t;
      controls.enabled = !usingGameCam && !gizmo.dragging;
      controls.update();
      updateGameCam(dt);
      tick(dt);
      renderPass.camera = activeCam; // keep composer in sync
      composer.render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // --- Boot content ---
    addPlane(); const c = addCube(); c.userData.rotate = true; refreshHierarchy(); onResize();

    // --- Public API ---
    window.DRGE = { THREE, scene, camera, gameCam, renderer, controls, addCube, addPlane, addLight, serialize, loadFromJSON, addSystem, log };
    log('Ready. Tip: window.DRGE in DevTools. Drag & drop a .glb onto the viewport.');
  </script>
</body>
</html>
