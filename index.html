<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Rise™ Engine Editor</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0e0e0e;
      color: #eee;
      overflow: hidden;
    }

    /* Topbar */
    #topbar {
      height: 42px;
      background: linear-gradient(#1a1a1a, #121212);
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-bottom: 1px solid #333;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    #topbar button {
      margin-right: 10px;
      background: #252525;
      border: none;
      border-radius: 4px;
      color: #ddd;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    #topbar button:hover {
      background: #444;
    }

    /* Layout grid */
    #editor {
      display: grid;
      grid-template-columns: 220px 1fr 280px;
      grid-template-rows: 1fr 160px;
      height: calc(100vh - 42px);
    }
    #hierarchy, #inspector, #console {
      background: #181818;
      padding: 8px;
      overflow-y: auto;
      border: 1px solid #222;
    }
    #hierarchy {
      border-right: 1px solid #222;
    }
    #inspector {
      border-left: 1px solid #222;
    }
    #console {
      grid-column: 1 / 4;
      border-top: 1px solid #222;
      font-family: monospace;
      font-size: 13px;
      color: #8f8;
      background: #101010;
    }
    #viewport {
      position: relative;
      background: #000;
    }

    /* Hierarchy items */
    #objectList li {
      list-style: none;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      margin: 2px 0;
    }
    #objectList li:hover {
      background: #2a2a2a;
    }
    #objectList li.selected {
      background: #444;
      color: #fff;
    }

    canvas { display: block; }
  </style>
</head>
<body>
  <div id="topbar">
    <button onclick="addCube()">+ Cube</button>
    <button onclick="addLight()">+ Light</button>
    <button onclick="resetCamera()">Reset Camera</button>
  </div>

  <div id="editor">
    <div id="hierarchy"><b>Hierarchy</b><ul id="objectList"></ul></div>
    <div id="viewport"></div>
    <div id="inspector"><b>Inspector</b><div id="inspectorContent">Select an object</div></div>
    <div id="console"><b>Console</b><div id="logs"></div></div>
  </div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script>
    // Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101018);

    // Camera
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth/(window.innerHeight-200), 0.1, 2000);
    camera.position.set(6,6,8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth-500, window.innerHeight-200);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById("viewport").appendChild(renderer.domElement);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(10,15,10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048,2048);
    scene.add(dirLight);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(100,100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness:0.1, roughness:0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI/2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Post-processing
    const composer = new THREE.EffectComposer(renderer);
    const renderPass = new THREE.RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.85);
    composer.addPass(bloomPass);

    // Object tracking
    let objects = [];
    let selected = null;

    const objectList = document.getElementById("objectList");
    const inspectorContent = document.getElementById("inspectorContent");
    const logs = document.getElementById("logs");

    function log(msg) {
      logs.innerHTML += msg + "<br>";
      logs.scrollTop = logs.scrollHeight;
    }

    // Add Cube
    function addCube() {
      const geo = new THREE.BoxGeometry(1,1,1);
      const mat = new THREE.MeshStandardMaterial({ color: 0x00aaff, metalness:0.4, roughness:0.3 });
      const cube = new THREE.Mesh(geo, mat);
      cube.castShadow = true;
      cube.receiveShadow = true;
      cube.position.y = 0.5;
      cube.name = "Cube " + (objects.length+1);
      scene.add(cube);
      objects.push(cube);
      updateHierarchy();
      log("Added " + cube.name);
    }

    // Add Light
    function addLight() {
      const light = new THREE.PointLight(0xffaa00, 1, 50);
      light.position.set(3,3,3);
      light.castShadow = true;
      light.name = "Light " + (objects.length+1);
      scene.add(light);
      objects.push(light);
      updateHierarchy();
      log("Added " + light.name);
    }

    // Update Hierarchy
    function updateHierarchy() {
      objectList.innerHTML = "";
      objects.forEach((obj) => {
        const li = document.createElement("li");
        li.textContent = obj.name;
        li.className = (selected === obj) ? "selected" : "";
        li.onclick = () => selectObject(obj);
        objectList.appendChild(li);
      });
    }

    // Select Object
    function selectObject(obj) {
      selected = obj;
      updateHierarchy();
      inspectorContent.innerHTML = `
        <p><b>${obj.name}</b></p>
        <p>Type: ${obj.type}</p>
        <p>Position:<br>
          X <input type="number" step="0.1" value="${obj.position.x}" onchange="selected.position.x=parseFloat(this.value)"><br>
          Y <input type="number" step="0.1" value="${obj.position.y}" onchange="selected.position.y=parseFloat(this.value)"><br>
          Z <input type="number" step="0.1" value="${obj.position.z}" onchange="selected.position.z=parseFloat(this.value)">
        </p>
      `;
      log("Selected " + obj.name);
    }

    function resetCamera() {
      camera.position.set(6,6,8);
      controls.target.set(0,0,0);
    }

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      composer.render();
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = (window.innerWidth-500)/(window.innerHeight-200);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth-500, window.innerHeight-200);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
